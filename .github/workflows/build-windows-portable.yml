name: Build Windows Portable

on:
  workflow_dispatch:

jobs:
  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Python
        run: |
          py -3 --version

      - name: Install npm dependencies
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build Windows SAM Encrypt CLI
        run: |
          $ErrorActionPreference = "Stop"

          $venv = Join-Path $env:RUNNER_TEMP "sam-encrypt-cli-venv"

          py -3 -m venv $venv

          $python = Join-Path $venv "Scripts\python.exe"

          & $python -m pip install --upgrade pip wheel
          & $python -m pip install -r helpers/sam_encrypt/requirements.txt pyinstaller

          Remove-Item "helpers/sam_encrypt/sam_encrypt_cli_bin" -Force -ErrorAction SilentlyContinue
          Remove-Item "helpers/sam_encrypt/sam_encrypt_cli_bin.exe" -Force -ErrorAction SilentlyContinue

          & $python -m PyInstaller `
            --clean `
            --onefile `
            --name sam_encrypt_cli_bin `
            --hidden-import _cffi_backend `
            --collect-all cffi `
            --collect-all nacl `
            --distpath helpers/sam_encrypt `
            --workpath "$env:RUNNER_TEMP\sam-encrypt-cli-build" `
            --specpath "$env:RUNNER_TEMP\sam-encrypt-cli-spec" `
            helpers/sam_encrypt/sam_encrypt_cli.py

          if (!(Test-Path "helpers/sam_encrypt/sam_encrypt_cli_bin.exe")) {
            throw "Windows SAM Encrypt CLI was not created"
          }

          Copy-Item "helpers/sam_encrypt/sam_encrypt_cli_bin.exe" "helpers/sam_encrypt/sam_encrypt_cli_bin" -Force

          $bytes = [System.IO.File]::ReadAllBytes("helpers/sam_encrypt/sam_encrypt_cli_bin.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "sam_encrypt_cli_bin.exe is not a Windows PE executable"
          }

          $env:SAM_ENCRYPT_HOME = Join-Path $env:RUNNER_TEMP "sam-encrypt-home"

          $status = & ".\helpers\sam_encrypt\sam_encrypt_cli_bin.exe" status
          $status
          $status | ConvertFrom-Json | Out-Null

          $groups = & ".\helpers\sam_encrypt\sam_encrypt_cli_bin.exe" list-groups
          $groups
          $groups | ConvertFrom-Json | Out-Null

      - name: Control checks
        run: |
          $ErrorActionPreference = "Stop"

          node --check main.js

          $pattern = "input\[type=file\]|filechooser|file-chooser|arm-next-file-chooser|get-next-file-chooser-state|webContents\.debugger|CDP|click\(\).*send|send-button|data-icon=.send|aria-label=.Send"
          $files = @(
            "main.js",
            "wa_preload.js",
            "settings_preload.js",
            "preview_preload.js"
          )

          $matches = Select-String -Path $files -Pattern $pattern -AllMatches -ErrorAction SilentlyContinue

          if ($matches) {
            $matches | Format-Table -AutoSize
            throw "Forbidden attachment automation pattern found"
          }

      - name: Build Windows Portable
        run: |
          npx electron-builder --win portable --x64 --publish never

      - name: Validate Windows artifact
        run: |
          $ErrorActionPreference = "Stop"

          $portable = Get-ChildItem -Path dist -File -Filter "*.exe" |
            Where-Object { $_.Length -gt 1000000 } |
            Select-Object -First 1

          if (-not $portable) {
            throw "Portable Windows EXE not found"
          }

          $portable.FullName
          $portable.Length

          $helper = Get-ChildItem -Path dist -Recurse -File |
            Where-Object { $_.Name -eq "sam_encrypt_cli_bin.exe" -or $_.Name -eq "sam_encrypt_cli_bin" } |
            Select-Object -First 1

          if (-not $helper) {
            throw "SAM Encrypt helper not found in Windows build output"
          }

          $helper.FullName
          $helper.Length

          $bytes = [System.IO.File]::ReadAllBytes($helper.FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Packaged SAM Encrypt helper is not a Windows PE executable"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: sam-whatsapp-web-windows-portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Package Windows Fast Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD 'dist\win-unpacked'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw 'Unpacked Windows app not found: dist\win-unpacked'
          }

          $required = @(
            'SAM WhatsApp Web.exe',
            'resources\app.asar',
            'resources\helpers\sam_encrypt\sam_encrypt_cli_bin.exe'
          )

          foreach ($relative in $required) {
            $fullPath = Join-Path $source $relative
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              throw "Missing file in unpacked Windows app: $relative"
            }
          }

          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($version -ne '0.6.0') {
            throw "Unexpected application version: $version"
          }

          # The normal Portable EXE and its unpacked source must stay marker-free.
          $sourceMarker = Join-Path $source 'resources\sam-fast-portable.mode'
          if (Test-Path -LiteralPath $sourceMarker) {
            throw 'Unexpected Fast Portable marker in normal EXE build source'
          }

          $zipPath = Join-Path $PWD "dist\SAM-WhatsApp-Web-$version-x64-FastPortable.zip"
          if (Test-Path -LiteralPath $zipPath) {
            throw "Fast Portable ZIP already exists: $zipPath"
          }

          # Zip directory CONTENTS, not the win-unpacked parent folder.
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          # Add marker and instructions to the Fast ZIP ONLY (not dist/win-unpacked).
          $zipUpdate = [System.IO.Compression.ZipFile]::Open(
            $zipPath, [System.IO.Compression.ZipArchiveMode]::Update
          )
          try {
            $markerName = 'resources/sam-fast-portable.mode'
            if ($zipUpdate.GetEntry($markerName)) {
              throw 'Fast Portable marker already exists in ZIP'
            }
            $markerEntry = $zipUpdate.CreateEntry($markerName)
            $markerStream = $markerEntry.Open()
            try {
              $markerBytes = [System.Text.Encoding]::ASCII.GetBytes('SAM_WHATSAPP_WEB_FAST_PORTABLE_060')
              $markerStream.Write($markerBytes, 0, $markerBytes.Length)
            }
            finally {
              $markerStream.Dispose()
            }

            $readme = @(
              'SAM WhatsApp Web 0.6.0 - Fast Portable (Windows x64)'
              ''
              '1. Розпакуйте весь ZIP до постійної папки, наприклад C:\SAM-WhatsApp-Web.'
              '2. Запускайте SAM WhatsApp Web.exe з цієї папки. Не переміщуйте EXE окремо.'
              '3. Всі файли та папки resources потрібно залишити поруч із EXE.'
              '4. Автоматичне оновлення вимкнене. Нову версію отримуйте повним ZIP.'
              '5. Програма не змінює автозапуск Windows. Якщо він потрібний:'
              '   Win+R -> shell:startup -> створіть ярлик на цей SAM WhatsApp Web.exe.'
              '6. Якщо була інша версія, перевірте її запис автозапуску в Windows.'
              '7. Для повного виходу скористайтеся меню програми або системним треєм.'
              '8. Налаштування і сеанс WhatsApp зберігаються у %APPDATA%\sam-whatsapp-web.'
              '9. Перед оновленням закрийте програму; не змішуйте файли різних версій.'
              ''
              'Fast Portable не потребує встановлення; інсталятор або права адміністратора не потрібні.'
              ''
            ) -join "`r`n"
            $readmeEntry = $zipUpdate.CreateEntry('README-FAST-PORTABLE-UK.txt')
            $readmeStream = $readmeEntry.Open()
            try {
              # UTF-8 BOM helps classic Windows Notepad detect Ukrainian text.
              $readmeBytes = [System.Text.Encoding]::UTF8.GetBytes(([string][char]0xFEFF) + $readme)
              $readmeStream.Write($readmeBytes, 0, $readmeBytes.Length)
            }
            finally {
              $readmeStream.Dispose()
            }
          }
          finally {
            $zipUpdate.Dispose()
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::OrdinalIgnoreCase
            )
            foreach ($entry in $archive.Entries) {
              [void]$entries.Add($entry.FullName.Replace('\', '/'))
            }

            foreach ($relative in $required) {
              $entryName = $relative.Replace('\', '/')
              if (-not $entries.Contains($entryName)) {
                throw "Missing file inside Fast Portable ZIP: $entryName"
              }
            }

            $markerCheck = $archive.GetEntry('resources/sam-fast-portable.mode')
            if ($null -eq $markerCheck) {
              throw 'Fast Portable marker missing inside ZIP'
            }
            $reader = [System.IO.StreamReader]::new($markerCheck.Open(), [System.Text.Encoding]::ASCII)
            try {
              $actualMarker = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
            if ($actualMarker -ne 'SAM_WHATSAPP_WEB_FAST_PORTABLE_060') {
              throw 'Fast Portable marker content mismatch'
            }
            if ($null -eq $archive.GetEntry('README-FAST-PORTABLE-UK.txt')) {
              throw 'Fast Portable user instructions missing inside ZIP'
            }
            Write-Output 'WIN_FAST_PORTABLE_MODE_MARKER=PASS'
            Write-Output 'WIN_FAST_PORTABLE_README=PASS'
          }
          finally {
            $archive.Dispose()
          }

          $size = (Get-Item -LiteralPath $zipPath).Length
          if ($size -lt 1000000) {
            throw "Fast Portable ZIP is unexpectedly small: $size bytes"
          }

          Write-Output "WIN_FAST_PORTABLE_ZIP=PASS"
          Write-Output "WIN_FAST_PORTABLE_ZIP_SIZE=$size"
          Write-Output "WIN_FAST_PORTABLE_ZIP_SHA256=$((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash)"

      - name: Upload Windows Fast Portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: sam-whatsapp-web-windows-fast-portable
          path: dist/*-FastPortable.zip
          if-no-files-found: error
