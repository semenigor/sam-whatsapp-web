name: Build Linux DEB

on:
  workflow_dispatch:

jobs:
  build-linux-deb:
    name: Build Linux DEB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm file python3 python3-venv python3-pip

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Linux SAM Encrypt CLI
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/sam-encrypt-cli-venv"
          "$RUNNER_TEMP/sam-encrypt-cli-venv/bin/python" -m pip install --upgrade pip wheel
          "$RUNNER_TEMP/sam-encrypt-cli-venv/bin/python" -m pip install -r helpers/sam_encrypt/requirements.txt pyinstaller

          rm -f helpers/sam_encrypt/sam_encrypt_cli_bin

          "$RUNNER_TEMP/sam-encrypt-cli-venv/bin/python" -m PyInstaller \
            --clean \
            --onefile \
            --name sam_encrypt_cli_bin \
            --hidden-import _cffi_backend \
            --collect-all cffi \
            --collect-all nacl \
            --distpath helpers/sam_encrypt \
            --workpath "$RUNNER_TEMP/sam-encrypt-cli-build" \
            --specpath "$RUNNER_TEMP/sam-encrypt-cli-spec" \
            helpers/sam_encrypt/sam_encrypt_cli.py

          chmod 0755 helpers/sam_encrypt/sam_encrypt_cli_bin

          file helpers/sam_encrypt/sam_encrypt_cli_bin
          file helpers/sam_encrypt/sam_encrypt_cli_bin | grep -q 'ELF 64-bit'

          SAM_ENCRYPT_HOME="$RUNNER_TEMP/sam-encrypt-home" \
            helpers/sam_encrypt/sam_encrypt_cli_bin status | python3 -m json.tool

          SAM_ENCRYPT_HOME="$RUNNER_TEMP/sam-encrypt-home" \
            helpers/sam_encrypt/sam_encrypt_cli_bin list-groups | python3 -m json.tool

      - name: Control checks
        run: |
          node --check main.js
          bash -n build/linux/deb-after-install.sh
          bash -n build/linux/deb-after-remove.sh
          ! grep -RInE "DataTransfer|input\\[type=file\\]|filechooser|webContents\\.debugger|auto-attach|drag-and-drop|CDP" main.js wa_preload.js settings_preload.js preview_preload.js

      - name: Build DEB
        run: npm run dist:linux:deb

      - name: Validate DEB
        run: |
          set -euo pipefail

          DEB_FILE="$(find dist -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB_FILE"

          file "$DEB_FILE"
          test "$(stat -c '%s' "$DEB_FILE")" -gt 1000000

          dpkg-deb --info "$DEB_FILE"
          DEB_CONTENTS="$RUNNER_TEMP/deb-contents.txt"
          dpkg-deb --contents "$DEB_FILE" > "$DEB_CONTENTS"
          sed -n '1,80p' "$DEB_CONTENTS"

          EXTRACT_DIR="$RUNNER_TEMP/deb-root"
          mkdir -p "$EXTRACT_DIR"
          dpkg-deb -x "$DEB_FILE" "$EXTRACT_DIR"

          CLI_BIN="$(find "$EXTRACT_DIR" -type f -path '*/resources/helpers/sam_encrypt/sam_encrypt_cli_bin' | head -n 1)"
          test -n "$CLI_BIN"

          file "$CLI_BIN"
          file "$CLI_BIN" | grep -q 'ELF 64-bit'

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v6
        with:
          name: sam-whatsapp-web-deb
          path: dist/*.deb
          if-no-files-found: error
